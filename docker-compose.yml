services:
  db: image:postgres:16
    environment:
    POSTGRES_USER:dnd
    POSTGRES_PASSWORD:dnd
    POSTGRES_DB:dnd
  ports: ["5432:5432"]
  volumes: [pgdata:/var/lib/postgresql/data]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U dnd"]
    interval: 3s
    timeout: 3s
    retries: 15

api:
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://dnd:dnd@db:5432/dnd
    JWT_SECRET: dev-secret-change-me
  ports: ["8000:8000"]
  volumes: ["./backend:/srv"]
  depends_on:
    db:
      condition: service_healthy

volumes:
  pgdata: